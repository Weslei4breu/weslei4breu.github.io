<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>YWY KATU</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#111;display:flex;justify-content:center;min-height:100vh}
#A{width:100%;max-width:430px;min-height:100vh;background:#f3f4f6;display:flex;flex-direction:column;overflow:hidden}

/* ── LOGIN ── */
#LG{display:flex;flex-direction:column;align-items:center;background:#fff;min-height:100vh}
#LG img{width:100%;display:block}
#LG .foot{width:100%;padding:14px 24px 36px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:13px 20px;width:100%;max-width:320px;cursor:pointer;font-size:15px;font-weight:700;color:#111;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.gbtn:active{transform:scale(.97)}
.gico{width:24px;height:24px;border-radius:50%;background:conic-gradient(#4285F4 90deg,#EA4335 180deg,#FBBC05 270deg,#34A853 360deg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#fff;flex-shrink:0}
.lnote{font-size:11px;color:#9ca3af;text-align:center}

/* ── SHELL ── */
#SH{display:none;flex-direction:column;height:100vh;overflow:hidden}
#SCR{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#SCR::-webkit-scrollbar{display:none}
#TB{display:flex;background:#fff;border-top:1px solid #e5e7eb;padding:8px 0 18px;flex-shrink:0}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#9ca3af;font-size:10px;font-weight:600;cursor:pointer;padding:4px 0}
.tb.on{color:#16a34a}
.tb svg{width:22px;height:22px}

/* ── HEADER ── */
.hdr{padding:44px 16px 13px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:21px;font-weight:800;color:#111}
.hdr small{font-size:12px;color:#6b7280;display:block;margin-top:2px}
.bdg{background:linear-gradient(135deg,#c8960a,#f0c040);border-radius:20px;padding:5px 10px;font-size:11px;font-weight:700;color:#3d2a00}
.bk{background:none;border:none;font-size:24px;color:#6b7280;cursor:pointer;padding:2px 8px 2px 0;line-height:1}

/* ── CAIXA BAR ── */
.cbar{margin:12px;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border:2px solid}
.cbar.open{background:#f0fdf4;border-color:#16a34a}
.cbar.closed{background:#fef2f2;border-color:#ef4444}
.btn-abrir{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;background:#16a34a;color:#fff}
.btn-fechar{padding:10px 16px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;background:#ef4444;color:#fff}

/* ── CARDS ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:14px;padding:13px;border:1px solid #e5e7eb}
.card.hi{border-color:#16a34a;background:#f0fdf4}
.cl{font-size:10px;color:#6b7280;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.cv{font-size:19px;font-weight:800;color:#111}
.cs{font-size:11px;color:#6b7280;margin-top:2px}
.sec{background:#fff;margin:0 12px 12px;border-radius:14px;padding:13px;border:1px solid #e5e7eb}
.st{font-size:11px;font-weight:700;color:#374151;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.rw{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:13px;color:#374151}
.rw b{font-weight:700}
.ibox{margin:0 12px 12px;padding:12px;background:#fffbeb;border-radius:14px;border:1px solid #fbbf24;font-size:12px;color:#92400e;text-align:center;line-height:1.6}

/* ── PDV ── */
.chip{padding:6px 12px;border:1px solid #e5e7eb;border-radius:20px;font-size:12px;font-weight:600;color:#374151;background:#fff;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.on{background:#16a34a;border-color:#16a34a;color:#fff}
.pcard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:11px;border:1px solid #e5e7eb;cursor:pointer;margin-bottom:8px}
.pcard:active{border-color:#16a34a}
.pico{width:40px;height:40px;border-radius:20px;background:#f9fafb;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
#CB .cart-bar{background:#111827;border-radius:16px 16px 0 0;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.bg{background:#16a34a;color:#fff;border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer}
.bg:active{opacity:.85}
.bo{border:1.5px solid #4b5563;background:#374151;color:#fff;border-radius:12px;padding:10px;font-size:13px;cursor:pointer}

/* ── ADMIN ── */
.amenu{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:14px}
.abtn{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.abtn:active{border-color:#16a34a;background:#f0fdf4;transform:scale(.97)}
.irow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:11px;border:1px solid #e5e7eb;margin-bottom:8px}
.pill{background:#f3f4f6;border-radius:8px;padding:2px 6px;font-size:10px;color:#374151;font-weight:600}
.fab{display:flex;align-items:center;justify-content:center;gap:6px;background:#16a34a;border-radius:14px;padding:12px;border:none;cursor:pointer;color:#fff;font-size:14px;font-weight:700;width:100%;margin-bottom:12px}
.vcard{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:13px;border:1px solid #e5e7eb;margin-bottom:8px}
.tg{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.tgg{background:#dcfce7;color:#15803d}
.tgr{background:#fef2f2;color:#ef4444}
.tgy{background:#fef9c3;color:#854d0e}
.repcard{background:#fff;border-radius:14px;padding:13px;border:1px solid #e5e7eb;margin-bottom:10px;cursor:pointer}
.repcard:active{border-color:#16a34a}

/* ── FORM ── */
.fl{font-size:12px;font-weight:600;color:#374151;margin-bottom:6px;display:block;margin-top:12px}
.fi{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:11px 13px;font-size:14px;color:#111;outline:none}
.fi:focus{border-color:#16a34a}
.fsel{width:100%;border:1.5px solid #e5e7eb;border-radius:12px;padding:11px 13px;font-size:14px;color:#111;outline:none;background:#fff}
.fsel:focus{border-color:#16a34a}
.edtbtn{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px;color:#2563eb;font-weight:600}
.delbtn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px;color:#ef4444;font-weight:600}

/* ── MODAL ── */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 44px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto}
.mdl::-webkit-scrollbar{display:none}
.drag{width:36px;height:4px;background:#e5e7eb;border-radius:2px;margin:0 auto 16px}
.mt{font-size:18px;font-weight:700;color:#111;margin-bottom:4px}
.ms{font-size:13px;color:#6b7280;margin-bottom:14px}
.vinp{border:2px solid #16a34a;border-radius:12px;padding:13px;font-size:24px;font-weight:800;text-align:center;width:100%;color:#111;outline:none;margin-bottom:14px}
.qin{border:2px solid #16a34a;border-radius:12px;padding:11px;font-size:22px;font-weight:800;text-align:center;width:100%;color:#111;outline:none;margin-bottom:11px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:13px}
.qbtn{border:1.5px solid #e5e7eb;border-radius:10px;padding:9px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#374151;background:#fff}
.qbtn.on{background:#16a34a;border-color:#16a34a;color:#fff}
.mbtns{display:flex;gap:10px;margin-top:6px}
.mc{flex:1;border:1.5px solid #e5e7eb;border-radius:12px;padding:13px;background:#fff;color:#374151;font-size:14px;font-weight:600;cursor:pointer}
.mok{flex:2;background:#16a34a;border:none;border-radius:12px;padding:13px;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.mok:disabled{opacity:.4;cursor:not-allowed}
.mok.red{background:#ef4444}
.pgbtn{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:14px;cursor:pointer;margin-bottom:10px;font-size:15px;font-weight:700;color:#111;text-align:left}
.pgbtn.on{border-color:#16a34a;background:#f0fdf4}
.pgbtn:active{border-color:#16a34a}
.sbox{background:#f0fdf4;border-radius:12px;padding:13px;margin-bottom:14px}
.ybox{background:#fffbeb;border-radius:12px;padding:13px;margin-bottom:14px}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f3f4f6}
.rmb{background:#fef2f2;border:none;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:14px;color:#ef4444}
.qnt-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid #e5e7eb;background:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qnt-btn:active{transform:scale(.9)}
.qnt-box{display:flex;align-items:center;gap:10px;margin-top:4px;justify-content:flex-end}

/* ── BACKUP TABS ── */
.bktab{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}
.bkt{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#6b7280}
.bkt.on{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.bk-card{background:#fff;border-radius:14px;padding:14px;border:1px solid #e5e7eb;margin-bottom:10px}
.bk-action{display:flex;align-items:center;gap:12px;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;border:none;width:100%;text-align:left}
.bk-action:active{opacity:.85}
</style>
</head>

<div id="LG">
  <img id="LGI" src="" alt="YWY KATU">
  <div class="foot">
    <button class="gbtn" id="GBT">
      <div class="gico">G</div>
      Continuar com o Google
    </button>
    <p class="lnote">Dados salvos localmente · Backup via Drive ou Email</p>
  </div>
</div>

<div id="SH">
  <div id="SCR"></div>
  <div id="CB"></div>
  <div id="TB"></div>
</div>

<div id="MC"></div>

</div>

function vPainel(){
  var cx=S.cx,ab=cx&&cx.status==="aberto";
  var tot=totVend(S.vend),nv=S.vend.filter(function(v){return v.ok;}).length;
  var day=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  var h='<div class="hdr"><div><h1>Painel</h1><small style="text-transform:capitalize">'+day+'</small></div><div class="bdg">🌱 YWY KATU</div></div>';
  h+='<div class="cbar '+(ab?"open":"closed")+'">';
  h+='<div><div style="font-size:13px;font-weight:700;color:'+(ab?"#15803d":"#ef4444")+'">'+(ab?"🟢 Caixa Aberto":"🔴 Caixa Fechado")+'</div>';
  h+='<div style="font-size:11px;color:#6b7280;margin-top:2px">'+(ab?"Aberto às "+cx.ah+" · Troco: "+R(cx.vi):(cx?"Fechado às "+cx.fh:"Nenhum caixa aberto hoje"))+'</div></div>';
  h+=(ab?'<button class="btn-fechar" onclick="fCaixa()">Fechar Caixa</button>':'<button class="btn-abrir" onclick="oCaixa()">Abrir Caixa</button>')+'</div>';
  h+='<div class="g2"><div class="card hi"><div class="cl">Vendas do Caixa</div><div class="cv" style="color:#16a34a">'+R(tot)+'</div><div class="cs">'+nv+' venda(s)</div></div>';
  h+='<div class="card"><div class="cl">Produtos</div><div class="cv">'+PRODS.length+'</div><div class="cs">'+CATS.length+' categorias</div></div></div>';
  h+='<div class="sec"><div class="st">Resumo do Caixa</div>';
  h+='<div class="rw"><span>Troco Inicial</span><b>'+(cx?R(cx.vi):"—")+'</b></div>';
  h+='<div class="rw"><span>Abertura</span><b>'+(cx?cx.ah:"—")+'</b></div>';
  h+='<div class="rw"><span>Fechamento</span><b>'+(cx&&cx.fh?cx.fh:"Em aberto")+'</b></div>';
  ["dinheiro","pix","credito","debito"].forEach(function(m){
    var v=S.vend.filter(function(x){return x.pm===m&&x.ok;}).reduce(function(a,x){return a+x.tot;},0);
    h+='<div class="rw"><span>'+PL[m]+'</span><b style="color:'+PC[m]+'">'+R(v)+'</b></div>';
  });
  h+='<div class="rw"><span style="font-size:14px;font-weight:700">Total em Caixa</span><b style="font-size:16px;color:#16a34a">'+R(tot+(cx?cx.vi:0))+'</b></div></div>';

  return h;
}

function pCard(p){
  var cat=gc(p.c),kg=p.u==="kg"||p.u==="g";
  var qc=S.cart.filter(function(i){return i.pid===p.id || String(i.pid).startsWith(p.id+"_");}).reduce(function(a,i){return a+i.q;},0);
  var h = '<div class="pcard" onclick="tP('+p.id+')"><div class="pico">'+cat.e+'</div><div style="flex:1"><div style="font-size:14px;font-weight:700">'+p.name+'</div><div style="font-size:11px;color:#6b7280">'+cat.n+' · '+p.s+' '+p.u+'</div></div><div style="text-align:right"><div style="font-size:15px;font-weight:800;color:#16a34a">'+R(p.p)+'</div><div style="font-size:10px;color:#9ca3af">/'+p.u+(kg?' ⚖️':'')+'</div>';
  if(qc > 0){
    h += '<div class="qnt-box">';
    h += '<button class="qnt-btn" style="color:#ef4444;border-color:#fecaca" onclick="remQ('+p.id+', event)">-</button>';
    h += '<span style="font-size:13px;font-weight:800;color:#111">'+(kg?qc.toFixed(3):qc)+'</span>';
    if(!kg) h += '<button class="qnt-btn" style="color:#16a34a;border-color:#dcfce7" onclick="tP('+p.id+', event)">+</button>';
    h += '</div>';
  }
  h += '</div></div>';
  return h;
}
function fsrch(q){
  var t=q.toLowerCase().trim();
  var prods=S.catF>0?PRODS.filter(function(p){return p.c===S.catF;}):PRODS;
  if(t) prods=prods.filter(function(p){return p.name.toLowerCase().includes(t);});
  var el=ge("PLS");
  if(el) el.innerHTML=prods.map(pCard).join("")||'<div style="text-align:center;padding:30px;color:#9ca3af">Nenhum produto encontrado</div>';
}

/* ── VENDAS ── */
function vVendas(){
  var tot=totVend(S.vend);
  var h='<div class="hdr"><div><h1>Vendas</h1><small style="color:#16a34a;font-weight:700">Caixa: '+R(tot)+'</small></div></div><div style="padding:10px 12px 0">';
  if(!S.vend.length) return h+'<div style="text-align:center;padding:40px 20px;color:#9ca3af"><div style="font-size:40px;margin-bottom:12px">🧾</div><div style="font-size:15px;font-weight:600">Nenhuma venda neste caixa</div></div></div>';
  for(var i = S.vend.length - 1; i >= 0; i--) {
    var v = S.vend[i];
    h+='<div class="vcard"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:19px">'+PE[v.pm]+'</span><div><div style="font-size:13px;font-weight:700">'+PL[v.pm]+'</div><div style="font-size:11px;color:#6b7280">'+v.dt+' · '+v.n+' item(s)</div></div></div><div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><div style="font-size:15px;font-weight:800">'+R(v.tot)+'</div><div style="display:flex;gap:8px;align-items:center"><button onclick="estornarVenda('+i+')" style="background:none;border:none;color:#ef4444;font-size:10px;font-weight:700;cursor:pointer;padding:2px">ESTORNAR</button><span class="tg '+(v.ok?"tgg":"tgr")+'">'+(v.ok?"Concluída":"Cancelada")+'</span></div></div></div>';
  }
  return h+'</div>';
}

/* ── ADMIN ── */
function vAdmin(){
  if(!S.sub){
    var menus=[
      {id:"products",l:"Produtos",ic:"📦",s:"Cadastrar, editar, excluir"},
      {id:"categories",l:"Categorias",ic:"🏷️",s:"Organizar produtos"},
      {id:"reports",l:"Relatórios",ic:"📊",s:"Histórico de caixas"},
      {id:"backup",l:"Backup",ic:"☁️",s:"Drive ou Email"}
    ];
    var h='<div class="hdr"><div><h1>Administração</h1><small>YWY KATU Sistema</small></div></div><div class="amenu">';
    menus.forEach(function(m){
      h+='<div class="abtn" onclick="S.sub=\''+m.id+'\';draw()"><div style="font-size:32px">'+m.ic+'</div><div style="font-size:14px;font-weight:700;color:#111">'+m.l+'</div><div style="font-size:11px;color:#6b7280;text-align:center;line-height:1.4">'+m.s+'</div></div>';
    });
    return h+'</div>';
  }
  var bk='<button class="bk" onclick="S.sub=null;S.editP=null;S.editC=null;draw()">‹</button>';
  if(S.sub==="products") return vProds(bk);
  if(S.sub==="categories") return vCats(bk);
  if(S.sub==="reports") return vReps(bk);
  if(S.sub==="backup") return vBackup(bk);
  return "";
}

function vReps(bk){
  var h='<div class="hdr" style="display:flex;align-items:center;gap:6px">'+bk+'<div><h1>📊 Relatórios</h1><small>Caixas fechados</small></div></div><div style="padding:12px">';

  S.hist.slice().reverse().forEach(function(c,i){
    var tv=totVend(c.vend),nv=c.vend.filter(function(v){return v.ok;}).length;
    h+='<div class="repcard" onclick="S.rep=S.hist.slice().reverse()['+i+'];S.modal=\'rel\';draw()"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-size:14px;font-weight:700">📅 '+c.data+'</div><span class="tg tgr">Fechado</span></div><div style="display:flex;justify-content:space-between;font-size:13px;color:#6b7280;margin-bottom:6px"><span>🕐 '+c.ah+' → '+c.fh+'</span><span>Troco: '+R(c.vi)+'</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid #e5e7eb"><span style="font-size:13px">'+nv+' venda(s)</span><span style="font-size:16px;font-weight:800;color:#16a34a">'+R(tv)+'</span></div></div>';
  });
  return h+'</div>';

function vBackup(bk){
  var h='<div class="hdr" style="display:flex;align-items:center;gap:6px">'+bk+'<div><h1>☁️ Backup</h1><small>Salvar dados do sistema</small></div></div><div style="padding:12px">';
  // Tabs email / drive
  h+='<div class="bktab"><button class="bkt '+(S.bkTab==="email"?"on":"")+'" onclick="S.bkTab=\'email\';draw()">📧 Email</button><button class="bkt '+(S.bkTab==="drive"?"on":"")+'" onclick="S.bkTab=\'drive\';draw()">☁️ Google Drive</button></div>';

  if(S.bkTab==="email"){
    var tot=totVend(S.vend),nv=S.vend.filter(function(v){return v.ok;}).length;
    h+='<div class="bk-card"><div class="st">Enviar Relatório por Email</div>';
    h+='<label class="fl">Email do destinatário</label>';
    h+='<input type="email" id="EDST" class="fi" placeholder="seuemail@gmail.com" value="'+S.emailDest+'" oninput="S.emailDest=this.value">';
    h+='<div class="sbox" style="margin-top:14px"><div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:6px">Resumo que será enviado</div>';
    h+='<div style="font-size:13px;color:#374151;line-height:1.8">';
    h+=(S.cx&&S.cx.status==="aberto"?'✅ Caixa aberto desde '+S.cx.ah:'❌ Nenhum caixa aberto')+'<br>';
    h+='💰 Vendas: '+nv+' · Total: '+R(tot)+'<br>';
    h+='📦 Produtos: '+PRODS.length+' · Categorias: '+CATS.length+'<br>';
    h+='📋 Caixas no histórico: '+S.hist.length;
    h+='</div></div>';
    h+='<button class="mok" style="width:100%;margin-top:12px;padding:14px;font-size:14px" onclick="envEmail()">📧 Enviar por Email</button></div>';
    h+='<div class="ibox">O app abrirá seu Gmail ou cliente de email com o relatório completo preenchido. Basta clicar em Enviar.</div>';
  }

  if(S.bkTab==="drive"){
    h+='<div class="bk-card">';
    if(!S.gdToken){
      h+='<div class="st">Conectar ao Google Drive</div>';
      h+='<div style="font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:16px">Autorize o acesso para salvar os dados diretamente no seu Google Drive como arquivo JSON.</div>';
      h+='<button class="bk-action" style="background:#4285F4" onclick="autorizarDrive()"><div class="gico" style="width:28px;height:28px;font-size:13px;flex-shrink:0">G</div><div><div style="font-size:14px;font-weight:700;color:#fff">Conectar com Google</div><div style="font-size:11px;color:rgba(255,255,255,.8);margin-top:2px">Autorizar acesso ao Drive</div></div></button>';
    } else {
      h+='<div class="st">Google Drive Conectado ✅</div>';
      h+='<div style="background:#f0fdf4;border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;color:#15803d">Conta autorizada. Arquivos serão salvos em "YWY KATU Backups".</div>';
      h+='<button class="bk-action" style="background:#16a34a" onclick="salvarDrive()"><span style="font-size:24px">☁️</span><div><div style="font-size:14px;font-weight:700;color:#fff">Salvar Backup Agora</div><div style="font-size:11px;color:rgba(255,255,255,.8);margin-top:2px">Envia JSON com todos os dados</div></div></button>';
      h+='<button class="bk-action" style="background:#eff6ff;border:1.5px solid #bfdbfe" onclick="S.gdToken=null;draw()"><span style="font-size:24px">🔌</span><div style="font-size:14px;font-weight:700;color:#2563eb">Desconectar</div></button>';
    }
    h+='</div>';
    h+='<div class="ibox">O backup salva todos os produtos, categorias, histórico de caixas e vendas em um arquivo JSON seguro no seu Drive.</div>';
  }

  return h+'</div>';
}

/* ── MODAIS ── */
function renderModal(){
  var d=document.createElement("div");
  d.className="mov";
  d.addEventListener("click",function(e){
    if(e.target===d&&S.modal!=="fProd"&&S.modal!=="fCat"){S.modal=null;draw();}
  });
  var c="";
  if(S.modal==="abrir") c=mAbrir();
  else if(S.modal==="rel") c=mRel();
  else if(S.modal==="peso") c=mPeso();
  else if(S.modal==="pgto") c=mPgto();
  else if(S.modal==="cart") c=mCart();
  else if(S.modal==="fProd") c=mFProd();
  else if(S.modal==="fCat") c=mFCat();
  d.innerHTML=c;
  ge("MC").appendChild(d);
}

function mAbrir(){
  var num=parseFloat(S.vI)||0;
  var b4=[20,50,100,200].map(function(n){
    var s=Math.abs(num-n)<0.01;
    return '<div id="vb'+n+'" style="border:1.5px solid '+(s?"#16a34a":"#e5e7eb")+';border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;color:'+(s?"#fff":"#374151")+';background:'+(s?"#16a34a":"#fff")+'" onclick="sV('+n+')">'+R(n)+'</div>';
  }).join("");
  return '<div class="mdl"><div class="drag"></div><div class="mt">🟢 Abrir Caixa</div><div class="ms">Informe o valor disponível para troco</div><input class="vinp" type="number" step="0.01" min="0" placeholder="0,00" id="VINP" value="'+S.vI+'" oninput="S.vI=this.value;uV()"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px">'+b4+'</div><div class="sbox" style="text-align:center"><div style="font-size:12px;color:#6b7280;margin-bottom:4px">Troco disponível</div><div id="VPREV" style="font-size:26px;font-weight:800;color:#16a34a">'+R(num)+'</div></div><div class="mbtns" style="margin-top:14px"><button class="mc" onclick="S.modal=null;draw()">Cancelar</button><button class="mok" onclick="cAbrir()">🟢 Abrir</button></div></div>';
}

function mRel(){
  var r=S.rep;
  if(!r) return '<div class="mdl"><div class="drag"></div><button class="mok" style="width:100%" onclick="S.modal=null;draw()">Fechar</button></div>';
  var tv=totVend(r.vend);
  var pb={};
  r.vend.filter(function(v){return v.ok;}).forEach(function(v){pb[v.pm]=(pb[v.pm]||0)+v.tot;});
  var h='<div class="mdl"><div class="drag"></div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><span class="mt">📋 Relatório</span><span class="tg '+(r.status==="fechado"?"tgr":"tgg")+'">'+(r.status==="fechado"?"Fechado":"Aberto")+'</span></div><div style="font-size:12px;color:#6b7280;margin-bottom:14px">'+r.data+'</div>';
  h+='<div class="sbox"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  h+='<div><div style="font-size:10px;color:#6b7280;margin-bottom:3px">ABERTURA</div><div style="font-size:14px;font-weight:700">'+r.ah+'</div></div>';
  h+='<div><div style="font-size:10px;color:#6b7280;margin-bottom:3px">FECHAMENTO</div><div style="font-size:14px;font-weight:700">'+(r.fh||"Em aberto")+'</div></div>';
  h+='<div><div style="font-size:10px;color:#6b7280;margin-bottom:3px">TROCO INICIAL</div><div style="font-size:14px;font-weight:700;color:#2563eb">'+R(r.vi)+'</div></div>';
  h+='<div><div style="font-size:10px;color:#6b7280;margin-bottom:3px">TOTAL VENDAS</div><div style="font-size:14px;font-weight:700;color:#16a34a">'+R(tv)+'</div></div>';
  h+='</div></div>';
  var ks=Object.keys(pb);
  if(ks.length){
    h+='<div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">Por pagamento</div>';
    ks.forEach(function(m){h+='<div class="rw"><span>'+PL[m]+'</span><b style="color:'+PC[m]+'">'+R(pb[m])+'</b></div>';});
  } else {
    h+='<div style="text-align:center;color:#9ca3af;font-size:13px;padding:12px">Nenhuma venda</div>';
  }
  h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;border-top:2px solid #e5e7eb;margin-top:8px"><span style="font-size:14px;font-weight:700">Total em Caixa</span><span style="font-size:20px;font-weight:800;color:#16a34a">'+R(tv+r.vi)+'</span></div>';
  h+='<button class="mok" style="width:100%;margin-top:12px" onclick="S.modal=null;draw()">Fechar</button></div>';
  return h;
}

function mCart(){
  var tot=S.cart.reduce(function(a,i){return a+i.tot;},0);
  var h='<div class="mdl"><div class="drag"></div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><div class="mt">🛒 Carrinho</div><button onclick="S.cart=[];S.modal=null;draw()" style="background:#fef2f2;border:none;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700;color:#ef4444">Limpar tudo</button></div>';
  if(!S.cart.length){
    h+='<div style="text-align:center;padding:30px;color:#9ca3af">Carrinho vazio</div>';
  } else {
    h+='<div style="max-height:300px;overflow-y:auto">';
    S.cart.forEach(function(ci,idx){
      h+='<div class="cart-item"><div style="flex:1"><div style="font-size:14px;font-weight:700">'+ci.name+'</div><div style="font-size:12px;color:#6b7280">'+ci.q+(ci.u==="kg"?" kg":" un")+' × '+R(ci.pu)+' = <b style="color:#16a34a">'+R(ci.tot)+'</b></div></div><button class="rmb" onclick="rmI('+idx+')">✕</button></div>';
    });
    h+='</div><div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;border-top:2px solid #e5e7eb;margin-top:4px"><span style="font-size:14px;font-weight:700">Total</span><span style="font-size:22px;font-weight:800;color:#16a34a">'+R(tot)+'</span></div>';
    h+='<div class="mbtns" style="margin-top:12px"><button class="mc" onclick="S.modal=null;draw()">Continuar</button><button class="mok" onclick="S.modal=\'pgto\';S.pgTipo=null;S.dinVal=\'\';draw()">Finalizar →</button></div>';
  }
  h+='</div>';
  return h;
}

function mPgto(){
  var tot=S.cart.reduce(function(a,i){return a+i.tot;},0);
  var h='<div class="mdl"><div class="drag"></div><div class="mt">💳 Forma de Pagamento</div><div class="ms">Total: <b style="color:#16a34a;font-size:16px">'+R(tot)+'</b></div>';
  ["dinheiro","pix","credito","debito"].forEach(function(m){
    var sel=S.pgTipo===m;
    h+='<button class="pgbtn'+(sel?" on":"")+'" onclick="selPg(\''+m+'\')"><span style="font-size:22px">'+PE[m]+'</span><span>'+PL[m]+'</span>'+(sel?'<span style="margin-left:auto;color:#16a34a;font-size:18px">✓</span>':"")+'</button>';
  });
  if(S.pgTipo==="dinheiro"){
    var rec=parseFloat(S.dinVal)||0,troco=rec-tot;
    h+='<div class="ybox"><div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:8px">Valor recebido (R$)</div>';
    h+='<input type="number" step="0.01" id="DINV" class="vinp" style="font-size:20px;margin-bottom:8px" placeholder="0,00" value="'+S.dinVal+'" oninput="S.dinVal=this.value;draw()">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:#fff;border-radius:10px"><span style="font-size:13px;color:#374151">Troco:</span><b style="font-size:18px;color:'+(troco>=0?"#16a34a":"#ef4444")+'">'+R(Math.max(0,troco))+'</b></div></div>';
  }
  var pode=S.pgTipo&&(S.pgTipo!=="dinheiro"||(parseFloat(S.dinVal)||0)>=tot);
  h+='<div class="mbtns" style="margin-top:14px"><button class="mc" onclick="S.modal=null;draw()">Cancelar</button><button class="mok" '+(pode?"":"disabled")+' onclick="fVenda()">✅ Confirmar Venda</button></div></div>';
  return h;
}

function mFProd(){
  var p=S.editP||{id:0,name:"",p:0,u:"un",c:1,s:0};
  var novo=!p.id;
  var h='<div class="mdl"><div class="drag"></div><div class="mt">'+(novo?"➕ Novo Produto":"✏️ Editar Produto")+'</div>';
  h+='<label class="fl">Nome *</label><input class="fi" id="FPN" type="text" value="'+p.name+'" placeholder="Nome do produto">';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  h+='<div><label class="fl">Preço (R$) *</label><input class="fi" id="FPP" type="number" step="0.01" min="0" value="'+(p.p||"")+'" placeholder="0,00"></div>';
  h+='<div><label class="fl">Estoque</label><input class="fi" id="FPS" type="number" min="0" value="'+(p.s||"")+'" placeholder="0"></div>';
  h+='</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';
  h+='<div><label class="fl">Unidade</label><select class="fsel" id="FPU"><option value="un" '+(p.u==="un"?"selected":"")+'>Unidade</option><option value="kg" '+(p.u==="kg"?"selected":"")+'>Kg</option><option value="g" '+(p.u==="g"?"selected":"")+'>Gramas</option><option value="lt" '+(p.u==="lt"?"selected":"")+'>Litro</option></select></div>';
  h+='<div><label class="fl">Categoria</label><select class="fsel" id="FPC">';

function tP(id, e){
  if(e) e.stopPropagation();
  var p=PRODS.find(function(x){return x.id===id;});if(!p)return;
  if(p.u==="kg"||p.u==="g"){S.wP=p;S.wQ=0.5;S.modal="peso";draw();}
  else{
    var i=S.cart.findIndex(function(x){return x.pid===id;});
    if(i>=0){S.cart[i].q+=1;S.cart[i].tot=+(S.cart[i].q*p.p).toFixed(2);}
    else S.cart.push({pid:id,name:p.name,q:1,u:p.u,pu:p.p,tot:p.p});
    saveState();
    draw();
  }
}

function remQ(id, e){
  if(e) e.stopPropagation();
  var i = -1;
  for(var j=S.cart.length-1; j>=0; j--){
    if(S.cart[j].pid === id || String(S.cart[j].pid).startsWith(id + "_")){ i = j; break; }
  }
  if(i >= 0){
    var ci = S.cart[i];
    var p = PRODS.find(function(x){return x.id === id;});
    if(p.u === "un"){
      ci.q -= 1;
      if(ci.q <= 0) S.cart.splice(i, 1);
      else ci.tot = +(ci.q * ci.pu).toFixed(2);
    } else {
      S.cart.splice(i, 1);
    }
    saveState();
    draw();
  }
}

function fVenda(){
  if(!S.cart.length||!S.pgTipo)return;
  var tot=S.cart.reduce(function(a,i){return a+i.tot;},0);
  S.vend.push({pm:S.pgTipo,tot:tot,ok:true,n:S.cart.length,dt:new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+ft(new Date())});
  if(S.cx)S.cx.vend=S.vend.slice();
  S.cart=[];S.modal=null;S.pgTipo=null;
  S.tab="vendas";
  saveState();
  draw();
}

/* ── BACKUP GOOGLE DRIVE ── */
function autorizarDrive(){
  // Usa Google OAuth2 popup
  var clientId="YOUR_CLIENT_ID"; // usuário precisa configurar
  var scope="https://www.googleapis.com/auth/drive.file";
  var redirectUri=window.location.href.split("?")[0];
  // Como é arquivo local, usamos token implícito
  var url="https://accounts.google.com/o/oauth2/v2/auth"+
    "?client_id="+encodeURIComponent(clientId)+
    "&response_type=token"+
    "&scope="+encodeURIComponent(scope)+
    "&redirect_uri="+encodeURIComponent(redirectUri);
  // Abre popup de auth
  var w=window.open(url,"oauthpopup","width=500,height=600");
  // Monitora o popup
  var timer=setInterval(function(){
    try{
      if(w.closed){clearInterval(timer);return;}
      var hash=w.location.hash;
      if(hash&&hash.includes("access_token")){
        var params=new URLSearchParams(hash.substring(1));
        S.gdToken=params.get("access_token");
        w.close();
        clearInterval(timer);
        alert("✅ Google Drive conectado com sucesso!");
        draw();
      }
    }catch(e){}
  },500);
  // Fallback: se client_id não configurado, mostra instrução
  setTimeout(function(){
    if(!S.gdToken){
      S.gdToken="demo"; // modo demo
      alert("ℹ️ Modo demonstração ativado.\n\nPara conectar de verdade ao Google Drive, é necessário:\n1. Criar um projeto no Google Cloud Console\n2. Habilitar a Drive API\n3. Configurar o client_id no código\n\nPor enquanto, o backup via Email está disponível e funciona perfeitamente!");
      draw();
    }
  },3000);
}

function salvarDrive(){
  if(!S.gdToken){alert("Conecte ao Google Drive primeiro.");return;}
  // Monta o objeto de backup
  var backup={
    versao:"1.0",
    geradoEm:new Date().toISOString(),
    produtos:PRODS,
    categorias:CATS,
    caixaAtual:S.cx,
    historicoVendas:S.vend,
    historicoCaixas:S.hist
  };
  var json=JSON.stringify(backup,null,2);
  var nome="ywy-katu-backup-"+new Date().toISOString().slice(0,10)+".json";

  if(S.gdToken==="demo"){
    // Modo demo: baixa o arquivo localmente
    var blob=new Blob([json],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=nome; a.click();
    URL.revokeObjectURL(url);
    alert("✅ Backup baixado: "+nome+"\n\nNo modo real (com Google Drive configurado), o arquivo seria enviado diretamente para o Drive.");
    return;
  }

  // Upload real para Google Drive
  var meta=JSON.stringify({name:nome,mimeType:"application/json",parents:["root"]});
  var boundary="foo_bar_baz";
  var body="--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+meta+"\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+json+"\r\n--"+boundary+"--";
  fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+S.gdToken,
      "Content-Type":"multipart/related; boundary="+boundary
    },
    body:body
  }).then(function(r){
    if(r.ok){alert("✅ Backup salvo no Google Drive!\nArquivo: "+nome);}
    else{alert("❌ Erro ao salvar no Drive. Tente via Email.");}
  }).catch(function(){
    alert("❌ Erro de conexão. Tente via Email.");
  });
}

    URL.revokeObjectURL(url);
  }
}

// Compartilhar relatório via intent Android
function compartilharRelatorio() {
  var tot = totVend(S.vend);
  var texto = "YWY KATU - Relatório\n" + new Date().toLocaleDateString("pt-BR") + "\nTotal: " + R(tot);
  if (isAndroid) { AndroidBridge.compartilharTexto(texto, "Relatório YWY KATU"); return; }
  // Navegador: usa o compartilhar do celular; sem ele, copia o texto
  if (navigator.share) {
    navigator.share({ title: "Relatório YWY KATU", text: texto }).catch(function () {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(texto).then(function () { alert("Relatório copiado. É só colar no WhatsApp ou no e-mail."); });
  } else {
    alert(texto);
  }
}
